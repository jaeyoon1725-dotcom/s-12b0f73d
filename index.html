<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>계약서 전자서명</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #eef0f3; color: #111; }
  body { font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; -webkit-text-size-adjust: 100%; }
  .bar { position: sticky; top: 0; z-index: 5; background: #1f2a37; color: #fff; padding: 12px 16px; font-size: 15px; font-weight: 600; }
  .bar small { display: block; font-weight: 400; font-size: 12px; color: #c9d1db; margin-top: 2px; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 14px 12px 40px; }
  .card { background: #fff; border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 18px 16px; margin-bottom: 14px; }
  .msg { text-align: center; color: #555; padding: 40px 10px; line-height: 1.6; }

  /* 계약서 본문 */
  .doc { font-size: 13.5px; line-height: 1.6; }
  .doc h1 { text-align: center; font-size: 20px; letter-spacing: 4px; margin: 0 0 2px; }
  .doc .sub { text-align: center; font-size: 12px; color: #444; margin-bottom: 12px; }
  .doc .lead { margin: 0 0 10px; }
  .doc h2 { font-size: 14px; margin: 14px 0 5px; }
  .doc table { width: 100%; border-collapse: collapse; table-layout: auto; }
  .doc td, .doc th { border: 1px solid #666; padding: 5px 6px; vertical-align: middle; word-break: keep-all; overflow-wrap: anywhere; }
  .doc th { background: #f1f1f1; font-weight: 600; text-align: center; white-space: nowrap; }
  .doc .art { margin: 6px 0; text-align: justify; }
  .doc .item { margin: 1px 0 1px 1.2em; text-indent: -1.2em; }
  .doc .end { margin: 14px 0 4px; }
  .doc .date { text-align: center; font-size: 15px; margin: 10px 0 12px; letter-spacing: 1px; }
  .doc .party { margin-top: 6px; font-size: 12.5px; table-layout: fixed; }
  .doc .party tr:first-child > :nth-child(1) { width: 11%; }
  .doc .party tr:first-child > :nth-child(2) { width: 20%; }
  .doc .party tr:first-child > :nth-child(3) { width: 27%; }
  .doc .party tr:first-child > :nth-child(4) { width: 16%; }
  .doc .party tr:first-child > :nth-child(5) { width: 26%; }
  .doc .party th { white-space: normal; }
  .doc .party th.side { background: #e6e6e6; }
  .doc .sign { height: 56px; position: relative; min-width: 90px; }
  .doc .sign span { position: absolute; right: 5px; top: 4px; color: #888; font-size: 11px; }
  .doc .sign img { display: block; max-height: 42px; max-width: 100%; margin: 0 auto; }
  .doc .sign .ts { position: absolute; right: 4px; top: auto; bottom: 1px; font-size: 9px; color: #666; white-space: nowrap; }
  .doc .sign.me { background: #fff8d6; outline: 2px solid #f0b400; outline-offset: -2px; }
  @media (max-width: 520px) {
    .doc { font-size: 13px; }
    .doc .party { font-size: 11.5px; }
    .doc .party td, .doc .party th { padding: 4px 3px; }
  }
  /* 이미지 저장용 고정폭 사본 */
  .print { position: fixed; left: -10000px; top: 0; width: 794px; background: #fff; padding: 40px 48px; }
  .print .doc { font-size: 13px; }
  .print .doc .party { font-size: 12px; }
  .print .doc .sign.me { background: none; outline: none; }

  /* 서명 영역 */
  h3 { margin: 0 0 10px; font-size: 16px; }
  .who { font-size: 14px; color: #333; margin-bottom: 10px; }
  .who b { color: #000; }
  label.agree { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.5; margin-bottom: 12px; cursor: pointer; }
  label.agree input { width: 22px; height: 22px; flex: none; margin: 0; }
  .padbox { position: relative; border: 2px dashed #9aa4b1; border-radius: 8px; background: #fbfbfc; touch-action: none; }
  .padbox canvas { display: block; width: 100%; height: 190px; touch-action: none; }
  .padbox .hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #a0a8b3; font-size: 15px; pointer-events: none; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  button { font: inherit; border: 0; border-radius: 8px; padding: 14px 16px; font-size: 16px; font-weight: 600; cursor: pointer; }
  .ghost { background: #e4e7eb; color: #222; flex: 0 0 auto; }
  .primary { background: #1a73e8; color: #fff; flex: 1; }
  .primary:disabled { background: #a9c3ea; }
  .ok { background: #fee500; color: #191919; width: 100%; margin-top: 10px; }
  .done img.preview { width: 100%; border: 1px solid #ddd; border-radius: 6px; margin-top: 10px; }
  .note { font-size: 13px; color: #555; line-height: 1.6; margin-top: 10px; }
  .dl { display: inline-block; margin: 6px 10px 0 0; font-size: 14px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="bar">계약서 전자서명<small>내용을 확인하고 맨 아래에 서명해 주세요</small></div>
<div class="wrap">
  <div id="status" class="card msg">계약서를 불러오는 중입니다…</div>
  <div id="docCard" class="card hidden"><div id="doc" class="doc"></div></div>

  <div id="signCard" class="card hidden">
    <h3>서명하기</h3>
    <div class="who">서명자: <b id="whoName"></b></div>
    <label class="agree"><input type="checkbox" id="agree"> 위 계약 내용을 모두 확인했으며, 이에 동의하여 서명합니다.</label>
    <div class="padbox"><canvas id="pad"></canvas><div class="hint" id="hint">여기에 손가락으로 서명하세요</div></div>
    <div class="row">
      <button class="ghost" id="clear" type="button">다시 쓰기</button>
      <button class="primary" id="submit" type="button" disabled>서명 완료</button>
    </div>
  </div>

  <div id="doneCard" class="card done hidden">
    <h3>서명이 완료되었습니다</h3>
    <div class="note">아래 버튼을 눌러 <b>링크를 보내주신 분께 카카오톡으로 보내주세요.</b> 서명된 계약서 이미지와 서명 이미지 2개가 함께 전송됩니다.</div>
    <button class="ok" id="share" type="button">카카오톡으로 보내기</button>
    <div id="fallback" class="note hidden">
      공유 기능이 지원되지 않는 브라우저입니다. 아래 두 파일을 저장한 뒤 카카오톡으로 보내주세요. (이미지를 길게 눌러 저장할 수도 있습니다)<br>
      <a class="dl" id="dl1" download>① 서명된 계약서 저장</a>
      <a class="dl" id="dl2" download>② 서명 이미지 저장</a>
    </div>
    <img class="preview" id="preview" alt="서명된 계약서">
  </div>
</div>

<div class="print" id="print"></div>

      if (d[(y * w + x) * 4 + 3] > 10) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    var pad = 8; x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(w, x1 + pad); y1 = Math.min(h, y1 + pad);
    var c = document.createElement("canvas"); c.width = x1 - x0; c.height = y1 - y0;
    c.getContext("2d").drawImage(canvas, x0, y0, c.width, c.height, 0, 0, c.width, c.height);
    return c;
  }
  function stamp() {
    var n = new Date(), p = function (v) { return (v < 10 ? "0" : "") + v; };
    return n.getFullYear() + "." + p(n.getMonth() + 1) + "." + p(n.getDate()) + " " + p(n.getHours()) + ":" + p(n.getMinutes());
  }
  function toBlob(c) { return new Promise(function (res) { c.toBlob(res, "image/png"); }); }

  var files = [];
  function finish() {
    var btn = $("submit"); btn.disabled = true; btn.textContent = "처리 중…";
    var sig = trimmed(), sigUrl = sig.toDataURL("image/png"), ts = stamp();
    var cell = $(signer.cell);
    if (cell) cell.innerHTML = '<img alt="서명" src="' + sigUrl + '"><span class="ts">전자서명 ' + ts + "</span>";
    $("print").innerHTML = '<div class="doc">' + $("doc").innerHTML + "</div>";
    var img = new Image();
    img.onload = function () {
      html2canvas($("print"), { scale: 2, backgroundColor: "#ffffff", useCORS: true }).then(function (out) {
        return Promise.all([toBlob(out), toBlob(sig)]).then(function (bl) {
          files = [
            new File([bl[0]], "계약서_서명_" + signer.name + ".png", { type: "image/png" }),
            new File([bl[1]], "서명_" + signer.name + ".png", { type: "image/png" })
          ];
          $("preview").src = URL.createObjectURL(bl[0]);
          $("dl1").href = URL.createObjectURL(bl[0]); $("dl1").download = files[0].name;
          $("dl2").href = URL.createObjectURL(bl[1]); $("dl2").download = files[1].name;
          $("signCard").classList.add("hidden");
          $("doneCard").classList.remove("hidden");
          if (!(navigator.canShare && navigator.canShare({ files: files }))) {
            $("share").classList.add("hidden"); $("fallback").classList.remove("hidden");
          }
          $("doneCard").scrollIntoView({ behavior: "smooth" });
        });
      }).catch(function () {
        btn.disabled = false; btn.textContent = "서명 완료 (실패, 다시 눌러주세요)";
      });
    };
    img.src = sigUrl;
  }
  $("share").onclick = function () {
    navigator.share({ files: files, title: "계약서 서명", text: "주택 단기임대차 계약서 서명본입니다." })
      .catch(function (e) { if (e && e.name !== "AbortError") $("fallback").classList.remove("hidden"); });
  };
})();
</script>
